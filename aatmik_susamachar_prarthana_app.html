<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="आत्मिक सुसमाचार प्रार्थना App डाउनलोड करें।">
  <meta name="theme-color" content="#1769ff">
  <title>आत्मिक सुसमाचार प्रार्थना App</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 28px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(0,0,0,0.12);
    }

    .logo {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 28px;
      display: block;
      margin: 0 auto 20px;
    }

    h1 {
      margin: 0 0 12px;
      color: #17233d;
      font-size: 26px;
    }

    p {
      color: #667085;
      line-height: 1.6;
      font-size: 16px;
    }

    .download-btn {
      display: block;
      width: 100%;
      margin-top: 26px;
      padding: 17px 20px;
      border-radius: 15px;
      background: #1769ff;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .download-btn:hover {
      background: #0d56d9;
    }

    .download-btn:active {
      transform: scale(0.98);
    }

    .note {
      margin-top: 16px;
      font-size: 13px;
      color: #8a94a6;
    }
  </style>
</head>

<body>

  <main class="card">
    <!-- अपनी ऐप की फोटो app-logo.png नाम से इसी फोल्डर में रखें -->
    <img
      class="logo"
      src="app-logo.png"
      alt="आत्मिक सुसमाचार प्रार्थना App"
    >

    <h1>आत्मिक सुसमाचार प्रार्थना App</h1>

    <p>
      प्रार्थना के लिए हमारा ऐप डाउनलोड करें और ऐप की सुविधाओं का उपयोग करें।
    </p>

    <a
      class="download-btn"
      href="https://unlikely-green-caemhd5b.edgeone.dev"
      target="_blank"
      rel="noopener"
    >
      📲 ऐप डाउनलोड करें
    </a>

    <div class="note">
      डाउनलोड के बाद APK फाइल खोलकर अपने Android फोन में ऐप इंस्टॉल करें।
    </div>
  </main>

</body>
</html>
